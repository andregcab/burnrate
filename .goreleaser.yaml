# Release configuration. Cut one with:
#   git tag v0.1.0 && git push --tags
# CI then builds, publishes to GitHub Releases, and updates the Homebrew tap.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: burnrate
    main: ./cmd/burnrate
    binary: burnrate
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files: [README.md, LICENSE]

# Homebrew distribution.
#
# A cask, not a formula: formulae are meant to build from source, and GoReleaser
# only generated formula-shaped wrappers around prebuilt binaries as a
# workaround. Casks are the supported way to ship a compiled artifact.
#
# The post-install hook matters. These binaries are not code-signed or
# notarised, so macOS quarantines anything downloaded and refuses to run it with
# "the developer cannot be verified". Stripping the quarantine attribute is what
# makes `brew install` actually produce a working command.
homebrew_casks:
  - name: burnrate
    directory: Casks
    repository:
      owner: andregcab
      name: homebrew-tap
      branch: main
    binaries: [burnrate]
    homepage: https://github.com/andregcab/burnrate
    description: Your Cursor spend, at a glance — in the terminal
    license: MIT
    url:
      verified: github.com/andregcab/burnrate
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/burnrate"]
          end

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:', '^ci:']
